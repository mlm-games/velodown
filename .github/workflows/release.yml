name: Release builds

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (e.g., 0.1.25)'
        required: true
      auto_generate_changelog:
        description: 'Auto-generate changelog from commits'
        required: false
        default: true
        type: boolean
      mark_prerelease:
        description: 'Mark as prerelease'
        required: true
        default: 'false'
        type: boolean
      publish_to_choco:
        description: 'Publish to Chocolatey'
        required: false
        default: 'false'
        type: boolean
      publish_to_winget:
        description: 'Publish to WinGet'
        required: false
        default: 'false'
        type: boolean
      publish_to_scoop:
        description: 'Manual Publish to Scoop'
        required: false
        default: 'false'
        type: boolean
      publish_to_aur:
        description: 'Publish to AUR'
        required: false
        default: 'true'
        type: boolean
      publish_to_snap:
        description: 'Publish to Snapcraft'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ inputs.version_name }}
      release_notes: ${{ steps.generate_notes.outputs.release-notes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Need to checkout the branch that triggered this run so later job parts see the updated head
          ref: ${{ github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node (for npm version)
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Generate Release Notes
        id: generate_notes
        if: ${{ inputs.auto_generate_changelog == true }}
        uses: mlm-games/release-notes-generator@v1
        with:
          version: ${{ inputs.version_name }}
          changelog-path: 'CHANGELOG.md'
          auto-commit: 'true'
          exclude-patterns: 'chore:,ci:,docs:,Update release notes,Merge pull request'
          commit-message: 'docs: update release notes for v{{version}} [skip ci]'

      - name: Update version files
        run: |
          set -e
          echo "Bumping versions to ${{ inputs.version_name }}"
          # Update package.json
          npm version ${{ inputs.version_name }} --no-git-tag-version
          # Update tauri.conf.json using jq
          jq --arg new_version "${{ inputs.version_name }}" '.version = $new_version' src-tauri/tauri.conf.json > tmp.json && mv tmp.json src-tauri/tauri.conf.json
          # Update Cargo.toml version (package table)
          sed -i '0,/^version = /s//version = "${{ inputs.version_name }}"/' src-tauri/Cargo.toml

      - name: Commit and push version changes
        run: |
          set -e
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          git add -A
          # Avoid failing if nothing changed
          git commit -m "chore(release): bump version to ${{ inputs.version_name }}" || echo "No changes to commit"
          git push

  build-tauri:
    needs: prepare-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
            artifact-name: 'macOS'
          - platform: 'ubuntu-latest'
            args: ''
            artifact-name: 'Linux-x64'
          - platform: 'windows-latest'
            args: ''
            artifact-name: 'Windows-x64'
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository (updated branch head)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend deps
        run: npm ci

      - name: Build the app (tauri)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          distPath: "dist"
          tagName: v${{ needs.prepare-release.outputs.version }}
          releaseName: 'VeloDown v${{ needs.prepare-release.outputs.version }}'
          releaseBody: ${{ needs.prepare-release.outputs.release_notes || 'See the changelog for details.' }}
          releaseDraft: false
          prerelease: ${{ inputs.mark_prerelease }}
          args: ${{ matrix.args }}

      - name: Generate SHA256 checksums (Linux)
        if: matrix.platform == 'ubuntu-latest'
        shell: bash
        run: |
          set -e
          BUNDLE_DIR="src-tauri/target/release/bundle"
          EXT="deb|AppImage"
          echo "# SHA256 Checksums for ${{ matrix.artifact-name }}" > SHA256SUMS.txt
          echo "Generated on $(date)" >> SHA256SUMS.txt
          echo "" >> SHA256SUMS.txt
          if [ -d "$BUNDLE_DIR" ]; then
            find "$BUNDLE_DIR" -type f -regex ".*\.\($EXT\)" -print0 | xargs -0 -I{} sh -c 'sha256sum "{}" | awk "{print \$1\"  \"\$2}" >> SHA256SUMS.txt'
          else
            echo "Bundle dir not found: $BUNDLE_DIR" >&2
            exit 1
          fi
          cat SHA256SUMS.txt

      - name: Generate SHA256 checksums (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $BUNDLE_DIR="src-tauri/target/release/bundle"
          if (!(Test-Path $BUNDLE_DIR)) {
            "Bundle dir not found: $BUNDLE_DIR" | Write-Error
            exit 1
          }
          "# SHA256 Checksums for ${{ matrix.artifact-name }}" | Out-File -FilePath SHA256SUMS.txt -Encoding utf8
          "Generated on $(Get-Date)" | Out-File -FilePath SHA256SUMS.txt -Append -Encoding utf8
          "" | Out-File -FilePath SHA256SUMS.txt -Append -Encoding utf8
          Get-ChildItem -Path $BUNDLE_DIR -Recurse -Include *.msi,*.exe | ForEach-Object {
            $h = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)" | Out-File -FilePath SHA256SUMS.txt -Append -Encoding utf8
          }
          Get-Content SHA256SUMS.txt

      - name: Generate SHA256 checksums (macOS)
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          set -e
          BUNDLE_DIR="src-tauri/target/universal-apple-darwin/release/bundle"
          echo "# SHA256 Checksums for ${{ matrix.artifact-name }}" > SHA256SUMS.txt
          echo "Generated on $(date)" >> SHA256SUMS.txt
          echo "" >> SHA256SUMS.txt
          if [ -d "$BUNDLE_DIR" ]; then
            # Hash dmg and app bundles (for .app, hash the zip of the bundle for consistency)
            find "$BUNDLE_DIR" -type f -name "*.dmg" -print0 | xargs -0 -I{} sh -c 'shasum -a 256 "{}" | awk "{print \$1\"  \"\$2}" >> SHA256SUMS.txt'
            # If .app exists, zip it and hash the zip
            APP_PATH="$(find "$BUNDLE_DIR" -type d -name "*.app" -print -quit || true)"
            if [ -n "$APP_PATH" ]; then
              ZIP_OUT="${APP_PATH%/}.zip"
              ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$ZIP_OUT"
              shasum -a 256 "$ZIP_OUT" | awk '{print $1"  "$2}' >> SHA256SUMS.txt
            fi
          else
            echo "Bundle dir not found: $BUNDLE_DIR" >&2
            exit 1
          fi
          cat SHA256SUMS.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}-build
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ matrix.platform == 'macos-latest' && 'src-tauri/target/universal-apple-darwin/release/bundle/**/*' || 'src-tauri/target/release/bundle/**/*' }}
            SHA256SUMS.txt

  publish-chocolatey:
    needs: [build-tauri]
    if: ${{ inputs.publish_to_choco == true && inputs.mark_prerelease == false }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Windows build artifact
        uses: actions/download-artifact@v4
        with:
          name: Windows-x64-build
          path: ./choco-artifacts

      - name: Find exe installer
        id: find-exe
        shell: pwsh
        run: |
          $exeFile = Get-ChildItem -Path "./choco-artifacts" -Filter "*.exe" -Recurse | Select-Object -First 1
          if ($null -eq $exeFile) { Write-Error "No exe file found!"; exit 1 }
          "exe_path=$($exeFile.FullName)" >> $env:GITHUB_OUTPUT
          "exe_name=$($exeFile.Name)" >> $env:GITHUB_OUTPUT

      - name: Get SHA256 hash
        id: get-hash
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Path "${{ steps.find-exe.outputs.exe_path }}" -Algorithm SHA256).Hash
          "sha256=$($hash.ToLower())" >> $env:GITHUB_OUTPUT

      - name: Setup Chocolatey package files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "./choco-package/tools" | Out-Null
          Copy-Item -Path "./packaging/chocolatey/velodown.nuspec" -Destination "./choco-package/"
          Copy-Item -Path "./packaging/chocolatey/tools/*" -Destination "./choco-package/tools/" -Recurse -Force

      - name: Update Chocolatey files
        shell: pwsh
        run: |
          $nuspecPath = "./choco-package/velodown.nuspec"
          ((Get-Content $nuspecPath -Raw) -replace "{{VERSION}}","${{ inputs.version_name }}") | Set-Content $nuspecPath
          $installPath = "./choco-package/tools/chocolateyinstall.ps1"
          $content = Get-Content $installPath -Raw
          $content = $content -replace "{{VERSION}}","${{ inputs.version_name }}"
          $content = $content -replace "{{SHA256_HASH}}","${{ steps.get-hash.outputs.sha256 }}"
          $content = $content -replace "{{DOWNLOAD_URL}}","https://github.com/mlm-games/velodown/releases/download/v${{ inputs.version_name }}"
          $content = $content -replace "{{APPNAME}}","VeloDown"
          Set-Content $installPath $content

      - name: Pack and push Chocolatey package
        shell: pwsh
        env:
          CHOCO_API_KEY: ${{ secrets.CHOCO_API_KEY }}
        run: |
          cd choco-package
          choco pack
          choco push velodown.${{ inputs.version_name }}.nupkg --source https://push.chocolatey.org/ --api-key $env:CHOCO_API_KEY

  publish-winget:
    needs: [build-tauri]
    if: ${{ inputs.publish_to_winget == true && inputs.mark_prerelease == false }}
    runs-on: windows-latest
    steps:
      - name: Submit to WinGet
        uses: vedantmgoyal2009/winget-releaser@v2
        with:
          identifier: MLMGames.VeloDown
          version: ${{ inputs.version_name }}
          release-tag: v${{ inputs.version_name }}
          token: ${{ secrets.WINGET_TOKEN }}

  update-scoop-bucket:
    needs: [build-tauri]
    runs-on: ubuntu-latest
    if: ${{ inputs.publish_to_scoop == true && inputs.mark_prerelease == false }}
    permissions:
      contents: write
    steps:
      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Download Windows build artifact
        uses: actions/download-artifact@v4
        with:
          name: Windows-x64-build
          path: ./windows-build

      - name: Get installer info
        id: get-info
        run: |
          set -e
          EXE_FILE=$(find ./windows-build -name "*.exe" -type f | head -n 1)
          if [ -z "$EXE_FILE" ]; then
            echo "::error::No EXE file found!"
            exit 1
          fi
          if [ -f "./windows-build/SHA256SUMS.txt" ]; then
            HASH=$(grep "$(basename "$EXE_FILE")" ./windows-build/SHA256SUMS.txt | awk '{print $1}')
          else
            HASH=$(sha256sum "$EXE_FILE" | awk '{print $1}')
          fi
          echo "sha256=$HASH" >> $GITHUB_OUTPUT
          echo "exe_name=$(basename "$EXE_FILE")" >> $GITHUB_OUTPUT

      - name: Checkout Scoop bucket
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/buckets-scoop
          token: ${{ secrets.SCOOP_TOKEN || secrets.GITHUB_TOKEN }}
          path: scoop-bucket
          fetch-depth: 0

      - name: Update Scoop manifest
        run: |
          set -e
          cd scoop-bucket/bucket
          if [ ! -f "velodown.json" ]; then
            cp ../../packaging/scoop/velodown.json .
          fi
          jq --arg version "${{ inputs.version_name }}" \
             --arg hash "${{ steps.get-info.outputs.sha256 }}" \
             --arg url "https://github.com/mlm-games/velodown/releases/download/v${{ inputs.version_name }}/${{ steps.get-info.outputs.exe_name }}" \
             '.version = $version |
              .architecture."64bit".url = $url |
              .architecture."64bit".hash = $hash' \
             velodown.json > velodown.json.tmp && mv velodown.json.tmp velodown.json

      - name: Commit and push changes
        run: |
          set -e
          cd scoop-bucket
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add bucket/velodown.json
          git commit -m "Update VeloDown to ${{ inputs.version_name }}" || echo "No changes to commit"
          git push

  publish-snap:
    needs: [build-tauri]
    runs-on: ubuntu-latest
    if: ${{ inputs.publish_to_snap == true && inputs.mark_prerelease == false }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Download Linux build
        uses: actions/download-artifact@v4
        with:
          name: Linux-x64-build
          # path defaults to ./Linux-x64-build

      - name: Extract AppImage
        shell: bash
        run: |
          set -e
          APPIMAGE=$(find ./Linux-x64-build -name "*.AppImage" -type f | head -n 1)
          if [ -z "$APPIMAGE" ]; then
            echo "No AppImage found!"
            exit 1
          fi
          chmod +x "$APPIMAGE"
          "$APPIMAGE" --appimage-extract
          mkdir -p ./builds
          # Copy binary (common locations differ by project)
          cp squashfs-root/usr/bin/velodown ./builds/velodown 2>/dev/null || cp squashfs-root/velodown ./builds/velodown
          chmod +x ./builds/velodown

      - name: Update snap files
        shell: bash
        run: |
          set -e
          sed -i "s/{{VERSION}}/${{ inputs.version_name }}/g" packaging/snap/snapcraft.yaml
          cp -r packaging/snap/* .

      - name: Build snap
        id: build
        uses: snapcore/action-build@v1

      - name: Publish to Snap Store
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_TOKEN }}
        with:
          snap: ${{ steps.build.outputs.snap }}
          release: stable

  update-aur:
    needs: [build-tauri]
    runs-on: ubuntu-latest
    if: ${{ inputs.publish_to_aur == true && inputs.mark_prerelease == false }}
    steps:
      - name: Trigger AUR publish workflow
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'aur-publish.yml',
              ref: 'release',
              inputs: {
                version_name: '${{ inputs.version_name }}',
                increment_pkgrel: 'false'
              }
            });
            core.info('Triggered AUR publish workflow for version ${{ inputs.version_name }}');
